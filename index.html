<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bible Tracker" />
  <meta name="theme-color" content="#1c1917" />
  <link rel="manifest" href='data:application/manifest+json,{"name":"The Bible Timeline Tracker (90 & 365 Day Plans)","short_name":"Bible Tracker","start_url":".","display":"standalone","background_color":"#1c1917","theme_color":"#1c1917","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%231c1917%27/%3E%3Cpath d=%27M50 18v64M28 40h44%27 stroke=%27%23d97706%27 stroke-width=%2710%27 stroke-linecap=%27round%27/%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}' />
  <title>The Bible Timeline — 90 & 365-Day Reading Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-serif-title { font-family: 'Cinzel', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen pb-16">

  <!-- Header -->
  <header class="bg-stone-900 text-stone-100 sticky top-0 z-30 shadow-lg border-b border-stone-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand & Title -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-amber-600/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-serif-title font-bold text-lg shrink-0">
          ✝
        </div>
        <div>
          <h1 id="header-title" class="font-serif-title text-base sm:text-lg font-bold tracking-wide text-amber-400 leading-tight">The Bible Timeline</h1>
          <p id="header-subtitle" class="text-[11px] sm:text-xs text-stone-400">Salvation History Reading Tracker</p>
        </div>
      </div>

      <!-- Plan Switcher (90-Day vs 365-Day) -->
      <div class="inline-flex rounded-xl bg-stone-800 p-1 border border-stone-700">
        <button id="plan-btn-90" onclick="switchPlan('90')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition">
          90-Day Plan
        </button>
        <button id="plan-btn-365" onclick="switchPlan('365')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition">
          365-Day Plan
        </button>
      </div>

      <!-- Progress Pill & Backup Actions -->
      <div class="flex items-center gap-2 sm:gap-2.5 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 border-stone-800 pt-2 sm:pt-0">
        <div class="bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 flex items-center gap-2.5">
          <div class="text-right">
            <div class="text-xs font-semibold text-stone-200"><span id="stat-days">0</span> / <span id="stat-total">365</span> Days</div>
            <div class="text-[10px] text-amber-400 font-medium" id="stat-pct">0% Complete</div>
          </div>
          <div class="w-16 h-2 bg-stone-700 rounded-full overflow-hidden">
            <div id="stat-bar" class="h-full bg-amber-500 transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button onclick="exportData()" title="Export Backup JSON (Both Plans)" class="px-2.5 py-1.5 text-xs font-medium bg-stone-800 hover:bg-stone-700 text-stone-200 border border-stone-700 rounded-lg transition">
            Export
          </button>
          <label title="Restore Backup JSON" class="px-2.5 py-1.5 text-xs font-medium bg-stone-800 hover:bg-stone-700 text-stone-200 border border-stone-700 rounded-lg transition cursor-pointer">
            Restore
            <input type="file" accept=".json" class="hidden" onchange="importData(event)" />
          </label>
          <label title="User Guide" class="px-2.5 py-1.5 text-xs font-medium bg-stone-800 hover:bg-stone-700 text-stone-200 border border-stone-700 rounded-lg transition cursor-pointer">
            <a href="help.html">Help</a>
          </label>
        </div>
      </div>

    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-5 space-y-5">

    <!-- Up Next Reading Spotlight -->
    <section id="spotlight-card" class="bg-white rounded-xl shadow-sm border border-stone-200 p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="space-y-1.5">
        <div class="flex flex-wrap items-center gap-2">
          <span class="px-2 py-0.5 text-[11px] font-bold uppercase tracking-wider bg-amber-100 text-amber-800 rounded">Up Next Reading</span>
          <span id="spot-month" class="hidden px-2 py-0.5 text-[11px] font-bold uppercase tracking-wider bg-stone-200 text-stone-700 rounded"></span>
          <span id="spot-period" class="px-2.5 py-0.5 text-[11px] font-semibold rounded-full text-white"></span>
        </div>
        <h2 id="spot-title" class="text-lg sm:text-xl font-bold text-stone-900">Day 1</h2>
        <div id="spot-readings" class="flex flex-wrap gap-2 pt-1"></div>
      </div>
      <div class="flex sm:flex-col items-stretch sm:items-end gap-2 shrink-0">
        <button id="spot-complete-btn" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs sm:text-sm font-semibold rounded-lg shadow-sm transition flex items-center justify-center gap-1.5">
          <span>✓ Complete Day</span>
        </button>
        <button id="spot-jump-btn" class="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-medium rounded-lg transition">
          Go to Day ↓
        </button>
      </div>
    </section>

    <!-- Controls: Month Pills (90-Day only) + Era Bar + Search & Filters -->
    <section class="bg-white rounded-xl shadow-sm border border-stone-200 p-4 space-y-3">
      
      <!-- Month Filter Row (Visible only in 90-Day Plan) -->
      <div id="month-filter-row" class="hidden items-center gap-1.5 pb-2 border-b border-stone-100 overflow-x-auto no-scrollbar"></div>

      <!-- Era Filter Pills -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1" id="era-pills"></div>

      <!-- Search, Status, View Mode -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-stone-100">
        <div class="relative flex-1 min-w-[200px]">
          <input id="search-input" type="text" placeholder="Search book (e.g. Genesis, Luke, Acts) or Day #..." oninput="render()"
            class="w-full pl-3 pr-8 py-1.5 text-sm bg-stone-50 border border-stone-200 rounded-lg focus:outline-none focus:border-amber-500" />
        </div>

        <div class="flex items-center gap-1.5">
          <select id="status-filter" onchange="render()" class="text-xs font-medium bg-stone-50 border border-stone-200 rounded-lg px-2.5 py-1.5 focus:outline-none">
            <option value="all" id="status-all-label">All Days</option>
            <option value="unread">Unread</option>
            <option value="partial" id="status-partial-opt">In Progress</option>
            <option value="completed">Completed</option>
          </select>

          <div class="inline-flex rounded-lg border border-stone-200 p-0.5 bg-stone-50">
            <button id="view-list-btn" onclick="setView('list')" class="px-2.5 py-1 text-xs font-semibold rounded-md bg-stone-900 text-white">Timeline</button>
            <button id="view-grid-btn" onclick="setView('grid')" class="px-2.5 py-1 text-xs font-semibold rounded-md text-stone-600 hover:text-stone-900">Grid</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Main Content Container -->
    <div id="content-area" class="space-y-6"></div>

  </main>

  <!-- Note Modal -->
  <div id="note-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-stone-100 pb-3">
        <div>
          <span id="modal-plan-badge" class="text-[11px] font-bold uppercase tracking-wider text-amber-700">Daily Scripture Reflection</span>
          <h3 id="modal-day-title" class="text-base font-bold text-stone-900">Day 1</h3>
        </div>
        <button onclick="closeNoteModal()" class="text-stone-400 hover:text-stone-600 text-lg font-bold">✕</button>
      </div>
      <div id="modal-readings-summary" class="text-xs text-stone-600 bg-stone-50 p-2.5 rounded-lg border border-stone-200"></div>
      <textarea id="modal-note-input" rows="5" placeholder="Write your reflection, prayer, or study insights for today's scripture passages..."
        class="w-full p-3 text-sm border border-stone-300 rounded-lg focus:outline-none focus:border-amber-600"></textarea>
      <div class="flex justify-end gap-2">
        <button onclick="closeNoteModal()" class="px-3.5 py-1.5 text-xs font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Cancel</button>
        <button onclick="saveNoteFromModal()" class="px-4 py-1.5 text-xs font-semibold bg-amber-600 hover:bg-amber-700 text-white rounded-lg">Save Reflection</button>
      </div>
    </div>
  </div>
  <script src="helpers.js"></script>
</body>
</html>
